name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: MessagePack CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Zap fd6bc0e includes unsigned integers for the full MessagePack range.
    container: ghcr.io/zaplang-io/zap@sha256:ad34b8d071e25687494423e2dd8607fb94a4ee121d1951d67113a36f46000699
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Run Zap fixtures
        run: sh tools/run-tests.sh
