name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: MessagePack CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Run Zap fixtures
        run: sh tools/run-tests.sh
      - name: Validate candidate metadata
        run: sh tools/check-release.sh
      - name: Run examples through an installed path dependency
        run: sh tools/run-package-tests.sh
