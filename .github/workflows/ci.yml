name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: MessagePack CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Match the pinned Zap runtime used by zaplang-io/redis.
    container: ghcr.io/zaplang-io/zap@sha256:7cf901e2a8d465be3c480474238764411f77308c925cd3df26ef46b240f4e5c4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Run Zap fixtures
        run: sh tools/run-tests.sh
